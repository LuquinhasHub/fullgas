# ============================================================================
#  Fullgas B2B — configuração do Nginx (produção)
#  ---------------------------------------------------------------------------
#  Instalação e atualização:
#      sudo cp deploy/nginx/fullgas.conf /etc/nginx/sites-available/fullgas
#      sudo ln -sf /etc/nginx/sites-available/fullgas /etc/nginx/sites-enabled/fullgas
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Este arquivo passou a ser versionado porque a configuração só existia como
#  texto dentro de docs/09-deploy-vps-linux.md — e já estava desatualizada em
#  dois pontos que quebram a produção: o `root` apontava para /var/www/fullgas
#  (o deploy.sh serve de /var/www/fullgas-app/frontend) e o bloco HTTPS tinha
#  perdido a regra de URL limpa, o que faz /portal responder 404.
#
#  ARMADILHA DO NGINX, válida para o arquivo inteiro: `add_header` dentro de um
#  bloco `location` DESCARTA todos os add_header herdados do `server`. Não é
#  acumulativo. Por isso os headers de segurança aparecem repetidos em cada
#  location — remover uma dessas repetições apaga silenciosamente a proteção
#  naquele caminho, sem nenhum erro de sintaxe para avisar.
# ============================================================================

# Esconde a versão do Nginx nas respostas e nas páginas de erro.
# (Se a diretiva já existir em /etc/nginx/nginx.conf, esta linha é redundante e
#  inofensiva; mantida aqui para a configuração ser autossuficiente.)
server_tokens off;

# ---------------------------------------------------------------------------
#  HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fullgas.app.br www.fullgas.app.br;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
#  HTTPS — certificado de origem da Cloudflare (modo Full strict)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fullgas.app.br www.fullgas.app.br;

    ssl_certificate     /etc/nginx/ssl/fullgas.pem;
    ssl_certificate_key /etc/nginx/ssl/fullgas.key;

    # O front é servido direto do repositório clonado pelo deploy.sh. Não copie
    # os arquivos para outro diretório: o deploy faz `git reset --hard` aqui, e
    # uma cópia paralela ficaria velha sem ninguém perceber.
    root /var/www/fullgas-app/frontend;
    index index.html;

    # Uploads (fotos de reivindicação, anexos de notificação) até 60 MB.
    client_max_body_size 64M;

    # ---- URLs limpas (esconder o .html) ----
    # /index.html vira "/", e /algo.html vira /algo (301, para favoritos e
    # links antigos). O casamento é em $request_uri (a URI ORIGINAL do
    # cliente); o try_files interno abaixo NÃO altera $request_uri, então
    # servir /portal.html para o pedido /portal não dispara o redirect — sem
    # loop. NÃO REMOVA: sem isto o portal responde 404 em todas as telas.
    if ($request_uri ~ ^/index\.html) { return 301 /; }
    if ($request_uri ~ ^/([^?\s]+)\.html) { return 301 /$1; }

    # =======================================================================
    #  API — o bloco mais sensível do arquivo
    # =======================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # OBRIGATÓRIO: sem este header a API acha que está em http://, e o
        # appUrl() do mail.js monta os links de recuperação de senha com
        # http:// — o usuário recebe um e-mail com link inseguro que a
        # Cloudflare vai redirecionar, quebrando tokens em alguns clientes.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- NENHUMA RESPOSTA DE /api PODE SER CACHEADA ----
        # As respostas de autenticação carregam Set-Cookie. Uma cópia guardada
        # em qualquer camada entrega o cookie de sessão de um usuário ao
        # próximo que pedir a mesma URL — a sessão troca de dono em silêncio.
        #
        # A API já manda Cache-Control: no-store por conta própria (ver
        # api/src/server.js). Aqui o header é REMOVIDO e reescrito para
        # garantir exatamente um valor, sem duplicata, mesmo que alguém mude a
        # aplicação depois.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # Sem efeito enquanto não houver `proxy_cache` definido, e é justamente
        # essa a intenção: se algum dia alguém ligar cache de proxy neste
        # servidor para acelerar o site, estas duas linhas já deixam /api de
        # fora por padrão, em vez de depender de quem fizer a mudança lembrar.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Repetidos porque o add_header acima zerou a herança do server.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # =======================================================================
    #  Uploads públicos (catálogo) — servidos pela API
    #  O material de cliente (reivindicações, notificações) NÃO passa por aqui:
    #  sai por /api/arquivos/..., que confere no banco de quem é o arquivo.
    # =======================================================================
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nosniff é crítico AQUI: são arquivos enviados por usuários. Sem ele o
        # navegador "adivinha" o tipo e pode executar como HTML algo que foi
        # salvo com extensão de imagem.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # =======================================================================
    #  Assets versionados (?v=AAAAMMDDx) — cache longo é seguro
    # =======================================================================
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =======================================================================
    #  Páginas (HTML) — o resto
    # =======================================================================
    location / {
        try_files $uri $uri.html $uri/ =404;

        # As PÁGINAS não podem ficar presas no cache, e isto é o par necessário
        # do ?v= dos assets: o ?v= força o navegador a buscar o JS novo, mas
        # quem diz qual ?v= usar é o HTML. Com o HTML velho em cache, o usuário
        # roda a versão antiga inteira sem saber — foi exatamente o que
        # aconteceu num teste local, com o Chrome servindo HTML velho depois de
        # um deploy. "no-cache" não proíbe guardar: obriga a revalidar antes de
        # usar, o que mantém o 304 barato e o conteúdo sempre correto.
        add_header Cache-Control "no-cache" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ---- Content-Security-Policy ----
        # O front não tem NENHUM <script> inline nem handler inline (onclick=,
        # data-callback=), e é isso que torna `script-src 'self'` viável sem
        # 'unsafe-inline'. Manter essa propriedade ao escrever tela nova é o que
        # mantém esta linha de pé.
        #
        # Por diretiva:
        #   style-src 'unsafe-inline'  — inevitável hoje: o front gera centenas
        #       de atributos style= via innerHTML. Remover exige refatorar isso.
        #   img-src/media-src blob:    — OBRIGATÓRIO. As fotos protegidas são
        #       baixadas por fetch e viram URL de blob (api-adapter.js). Sem
        #       blob:, toda foto de reivindicação some da tela.
        #   connect-src viacep        — consulta de CEP no cadastro.
        #   challenges.cloudflare.com — a caixa anti-robô da tela de acesso.
        #   frame-ancestors 'none'    — o equivalente moderno do X-Frame-Options.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://viacep.com.br https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
