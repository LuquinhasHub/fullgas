<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullgas SpareParts Finder</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=20260722d">
  <link rel="apple-touch-icon" href="img/favicon.png?v=20260722d">
  <link rel="stylesheet" href="css/styles.css?v=20260730b">
</head>
<body>

  <div class="finder-top">
    <div>
      <!-- Único botão VOLTAR do finder (o comportamento está no finder.js). -->
      <button class="btn-voltar" id="fd-voltar" type="button">Voltar</button>
      <h1>SparePartsFinder</h1>
      <div class="who" id="fd-who"></div>
    </div>
    <div class="finder-top-right">
      <!-- mesma cesta da loja: as peças marcadas aqui viram pedido lá -->
      <a class="fd-cart" href="/loja#/carrinho" title="Ir ao carrinho da loja">🛒<span class="cart-n" id="fd-cart-n">0</span></a>
      <a href="/portal" title="Voltar ao portal" style="text-decoration:none;display:inline-flex;align-items:center;"><img src="img/Fullgas_logo003.png?v=20260730a" alt="FULLGAS" style="height:30px;width:auto;display:block;"></a>
    </div>
  </div>

  <button class="btn usage-btn" id="btn-usage" type="button">Usage list</button>

  <main class="finder">

    <!-- ====== painel de busca ====== -->
    <div class="search-panel" id="search-panel">
      <button class="sp-title" id="sp-toggle" type="button">▾ Search</button>
      <a href="#" class="reset" id="sp-reset">[Reset]</a>

      <div id="sp-body">
        <div class="sp-grid">
          <div>
            <label for="sp-vin">Search by VIN</label>
            <input id="sp-vin" type="text" placeholder="">

            <label for="sp-eng" style="margin-top:12px;">Engine Number</label>
            <input id="sp-eng" type="text" placeholder="">

            <label style="margin-top:12px;">Category</label>
            <div class="radio-line">
              <label><input type="radio" name="sp-cat" value="engine"> Engine</label>
              <label><input type="radio" name="sp-cat" value="chassi" checked> Frame</label>
            </div>

            <button class="btn" id="sp-search" type="button">Search</button>
          </div>

          <div>
            <label>Select Model</label>
            <!-- Filtro em cascata (Fullgas › Categoria › Ano › Tipo de motor ›
                 Cilindrada › Etiqueta). Substitui a antiga árvore de modelos:
                 mesmas informações, porém diretas e sempre funcionais. -->
            <div class="model-cascade" id="model-cascade">
              <div class="mc-root">Fullgas</div>
              <select id="mc-categoria"><option value="">Categoria…</option></select>
              <select id="mc-ano" disabled><option value="">Ano…</option></select>
              <select id="mc-tipomotor" disabled><option value="">Tipo de motor…</option></select>
              <select id="mc-cilindrada" disabled><option value="">Cilindrada…</option></select>
              <select id="mc-etiqueta" disabled><option value="">Modelo (etiqueta)…</option></select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="fd-view"></div>
  </main>

  <script src="js/config.js?v=20260727a"></script>
  <script src="js/store.js?v=20260727a"></script>
  <script src="js/api-adapter.js?v=20260804a"></script>
  <script src="js/finder.js?v=20260730b"></script>
</body>
</html>
